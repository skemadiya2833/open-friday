name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: pytest + ruff
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements/core.lock.txt
            requirements/dev.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/core.lock.txt
          pip install -r requirements/dev.lock.txt
          pip install -e .

      - name: Ruff (F, E9)
        run: ruff check friday tests main.py scripts --select F,E9

      - name: Pytest
        run: pytest -q -k "not real_hotkey and not hotkey_conflict"

      - name: Doctor JSON smoke
        run: python -m friday doctor --json --no-hardware
        continue-on-error: true
