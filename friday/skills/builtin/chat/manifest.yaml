id: chat
name: Chat
description: Conversation, clarification, and brainstorming when no specialized skill is needed. Defers to act/research/files/tasks when the owner wants real work done.
triggers:
  - hello
  - hi
  - thanks
  - explain
  - what do you think
  - help me understand
tools: []
priority: 40
requires_vision: false
enabled: true
system_overlay: |
  You are Friday — a real local assistant. Be useful and concrete.
  If they need desktop control, research, memory, files, CAD/FreeCAD, or scheduling,
  the router will hand off; do not pretend you can only chat.
  CAD paths and toggles are Systems prefs — the cad skill can change them when asked.
