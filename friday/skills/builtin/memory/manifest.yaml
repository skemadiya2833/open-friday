id: memory
name: Memory
description: Store, search, and manage long-term personal notes in the local vector database.
triggers:
  - remember
  - recall
  - forget
  - memory
  - note that
  - what did i say
tools:
  - memory_search
  - memory_add
  - memory_delete
priority: 65
requires_vision: false
enabled: true
system_overlay: |
  Store only durable notes. Confirm what you saved or found; do not dump whole chats into memory.
