[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-friday"
version = "3.0.0"
description = "Local-first personal AI assistant for Windows"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Sunil Kemadiya", email = "skemadiya@gmail.com" }]
keywords = ["assistant", "local-ai", "ollama", "windows", "computer-use"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime deps stay in requirements/core.lock.txt (installer / pip -r).
# Declaring an empty list keeps the wheel installable as an editable CLI shim.
dependencies = []

[project.scripts]
friday = "friday.cli:main"

[project.urls]
Homepage = "https://github.com/skemadiya2833/open-friday"
Repository = "https://github.com/skemadiya2833/open-friday"
Issues = "https://github.com/skemadiya2833/open-friday/issues"

[tool.setuptools.packages.find]
include = ["friday*"]
exclude = ["tests*", "scripts*", "web*", "skills*", "engine*", "deploy*"]

[tool.setuptools.package-data]
friday = ["py.typed"]
